# CI: on every push and pull request, run NoteDeck exactly as the README
# says, on a fresh GitHub-hosted Linux machine, and smoke-test it.
#
# 1. Build the images and start the stack with Docker Compose.
# 2. Run scripts/smoke-test.mjs against it.
# 3. If anything fails, print the containers and their logs.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # also allow a manual run from the Actions tab

permissions:
  contents: read # this workflow only reads the code

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Build, start and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node (for the smoke test)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Smoke test
        run: node scripts/smoke-test.mjs

      - name: Show the containers and their logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
