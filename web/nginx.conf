# nginx inside the "web" container.
# It does two jobs:
#   1. Serves the built React app (static files from Vite's dist/ folder).
#   2. Forwards every /api/ request to the "api" service on the Compose
#      network. "api" is the service name from docker-compose.yml; Docker's
#      DNS resolves it to the api container. Port 3000 is the port inside
#      that container, and it is never published to your PC.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy to the API container.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Vite puts a content hash in asset file names (index-3f9a1c.js), so
    # they can be cached "forever": a new build gets new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: any other path (/notes/7, /status...) gets index.html,
    # and React Router shows the right page in the browser.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
