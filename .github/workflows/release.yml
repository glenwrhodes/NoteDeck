# Build, test and release NoteDeck on every push to main.
#
# 1. Package the download: a zip with only what's needed to run the app with
#    Docker Compose.
# 2. Unzip it into an empty folder and start the stack FROM THERE, so the test
#    proves the zip itself is complete, not just the repo.
# 3. Run scripts/smoke-test.mjs against it.
# 4. Only if that passes, publish a GitHub release (v1.0.<run number>) with the
#    zip attached. Public repo releases can be downloaded without signing in.

name: Build, test and release

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow a manual run from the Actions tab

permissions:
  contents: write # needed to create releases and tags

# One release run at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, smoke-test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: v1.0.${{ github.run_number }}
      APP_DIR: ${{ github.workspace }}/../release-check/NoteDeck

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node (for the smoke test)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # git archive only takes files that are committed, so node_modules,
      # build output and .env files can never end up in the zip.
      - name: Package NoteDeck.zip
        run: |
          git archive --format=zip --prefix=NoteDeck/ -o NoteDeck.zip HEAD \
            README.md LICENSE docker-compose.yml .env.example api web
          unzip -l NoteDeck.zip

      - name: Unzip into a clean folder
        run: |
          mkdir -p "$APP_DIR/.."
          unzip -q NoteDeck.zip -d "$APP_DIR/.."
          ls -la "$APP_DIR"

      - name: Build the images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 240
        working-directory: ${{ env.APP_DIR }}

      - name: Smoke test
        run: node scripts/smoke-test.mjs

      - name: Show the containers and their logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
        working-directory: ${{ env.APP_DIR }}

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes || true
        working-directory: ${{ env.APP_DIR }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          **Download \`NoteDeck.zip\` below.** No GitHub account needed.

          ### Run it
          1. Install [Docker Desktop](https://www.docker.com/products/docker-desktop/) (Windows or macOS), or Docker Engine with the Compose plugin (Linux).
          2. Unzip, open a terminal in the \`NoteDeck\` folder and run \`docker compose up --build\`.
          3. Open http://localhost:8088 and click **REGISTER**.

          The README inside the zip explains everything, including the Docker concepts.

          Built from commit [${GITHUB_SHA::7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}). Before publishing, CI unzipped this exact file, started it with Docker Compose and ran the smoke test against it.
          EOF

          if gh release view "$VERSION" > /dev/null 2>&1; then
            # A re-run of the same workflow run: replace the file.
            gh release upload "$VERSION" NoteDeck.zip --clobber
          else
            gh release create "$VERSION" NoteDeck.zip \
              --target "$GITHUB_SHA" \
              --title "NoteDeck $VERSION" \
              --notes-file release-notes.md \
              --latest
          fi
